name: Bibliotheca + cinémathèque.

# Builds the GitHub Pages site: Bibliotheca at /<repo>/ and cinémathèque. at /<repo>/cinematheque/.
# Pull requests: type-check, test and build.
# Pushes to the default branch: the same, then publish to GitHub Pages
# (one-time setup: repo Settings -> Pages -> Source: "GitHub Actions").
on:
  pull_request:
    paths:
      - 'dream-bookshelf/**'
      - 'cinematheque/**'
      - '.github/workflows/dream-bookshelf.yml'
  push:
    branches: [master, main]
    paths:
      - 'dream-bookshelf/**'
      - 'cinematheque/**'
      - '.github/workflows/dream-bookshelf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-bookshelf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dream-bookshelf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dream-bookshelf/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build (served from /<repo-name>/ on GitHub Pages)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Test cinémathèque.
        working-directory: cinematheque
        run: node --test tests/model.test.mjs tests/lookup.test.mjs
      - name: Add cinémathèque. to the site (static files, no build step)
        working-directory: .
        run: |
          mkdir -p dream-bookshelf/dist/cinematheque
          cp -R cinematheque/index.html cinematheque/manifest.webmanifest cinematheque/sw.js cinematheque/css cinematheque/js cinematheque/fonts cinematheque/icons dream-bookshelf/dist/cinematheque/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dream-bookshelf/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
