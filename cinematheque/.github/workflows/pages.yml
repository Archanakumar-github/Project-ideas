name: GitHub Pages

# Pull requests: run the unit tests and collect the site.
# Pushes to the default branch: the same, then publish to this repository's own GitHub Pages site,
# https://<user>.github.io/<repo>/ (one-time setup: Settings -> Pages -> Source: "GitHub Actions").
# There is no build step: the app is plain HTML, CSS and ES modules with relative paths.
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR runs can stop; a deployment in progress always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Collect the static files
        run: |
          mkdir _site
          cp -R index.html manifest.webmanifest sw.js css js fonts icons _site/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
