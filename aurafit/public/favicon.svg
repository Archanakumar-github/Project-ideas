<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#1B1F2A"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </radialGradient>
    <linearGradient id="aura" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.55" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
  <!-- the aura ring: an open progress arc -->
  <path d="M256 92a164 164 0 1 1 -142 82" fill="none" stroke="url(#aura)" stroke-width="38" stroke-linecap="round"/>
  <!-- a rising peak: progress -->
  <path d="M168 330l62 -96 40 56 30 -40 44 80" fill="none" stroke="#F4F5FA" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="344" cy="330" r="15" fill="#2DD4BF"/>
</svg>
