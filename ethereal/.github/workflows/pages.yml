name: GitHub Pages

# Pull requests: type-check, test and build the web app.
# Pushes to the default branch: the same, then publish the web build to this repository's own
# GitHub Pages site, https://<user>.github.io/<repo>/
# (one-time setup: Settings -> Pages -> Source: "GitHub Actions").
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR runs can stop; a deployment in progress always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the web app (served from /<repo>/)
        run: npm run build:web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_NO_TELEMETRY: 1
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
