<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Ethereal: a crescent moon and a single star over a deep indigo night. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2E2A63"/>
      <stop offset="0.55" stop-color="#191A44"/>
      <stop offset="1" stop-color="#0B0C22"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D9B26F" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#D9B26F" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D9B26F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B9A8E3" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#B9A8E3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DFB2"/>
      <stop offset="0.55" stop-color="#E2C285"/>
      <stop offset="1" stop-color="#C49A55"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="500" cy="500" r="230" fill="#fff"/>
      <circle cx="600" cy="420" r="205" fill="#000"/>
    </mask>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <circle cx="300" cy="790" r="380" fill="url(#haze)"/>
    <g fill="#EFE6D2">
      <circle cx="180" cy="200" r="3.5" opacity=".55"/><circle cx="830" cy="170" r="2.5" opacity=".45"/>
      <circle cx="880" cy="560" r="3" opacity=".4"/><circle cx="140" cy="560" r="2.2" opacity=".35"/>
      <circle cx="260" cy="880" r="2.6" opacity=".35"/><circle cx="760" cy="860" r="3.2" opacity=".4"/>
      <circle cx="410" cy="130" r="2" opacity=".35"/><circle cx="940" cy="390" r="2" opacity=".3"/>
    </g>
  </g>
  <g id="symbol">
    <circle cx="500" cy="500" r="360" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#gold)" mask="url(#crescent)"/>
    <path d="M708 300 C714 352 726 364 778 370 C726 376 714 388 708 440 C702 388 690 376 638 370 C690 364 702 352 708 300 Z" fill="#F3DFB2"/>
    <circle cx="708" cy="370" r="46" fill="url(#glow)"/>
  </g>
</svg>
